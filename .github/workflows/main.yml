name: Build NWA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi make python3 zip

      - name: Compile binary and build .nwa package
        run: |
          make clean && make
          arm-none-eabi-objcopy -O binary target/io-arcade.nwa target/app.bin
          python3 - << 'EOF'
          import json, zipfile
          with open("target/metadata.json", "w") as f:
              json.dump({"name": "IO Arcade"}, f)
          with zipfile.ZipFile("target/io-arcade-pkg.nwa", "w", zipfile.ZIP_DEFLATED) as z:
              z.write("target/app.bin", "app.bin")
              z.write("target/metadata.json", "metadata.json")
          EOF
          ls -lh target/

      - uses: actions/upload-artifact@v4
        with:
          name: io-arcade-nwa
          path: target/io-arcade-pkg.nwa
